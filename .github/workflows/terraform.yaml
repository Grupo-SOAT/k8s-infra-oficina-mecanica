name: Deploy AWS Resources

on:
  repository_dispatch:
    types:
      - lambda-updated
      - db-deployed
  workflow_dispatch:
    inputs:
      lambda_key:
        description: "Chave S3 do zip da Lambda (opcional; vazio usa o artefato mais recente do bucket)"
        required: false
      lambda_hash:
        description: "SHA256 base64 do zip da Lambda (opcional)"
        required: false

concurrency:
  group: deploy-aws-resources
  cancel-in-progress: false

jobs:

  deploy-infra:

    name: Deploy AWS Resources

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform on Runner
        uses: hashicorp/setup-terraform@v4
        with:
            terraform_version: "1.15.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set Secrets for Terraform
        run: |
          echo "TF_VAR_aws_region=${{ vars.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "TF_VAR_git_repo_url=${{ vars.GIT_INFRA_REPO_URL }}" >> "$GITHUB_ENV"
          echo "TF_VAR_git_target_revision_branch=${{ vars.GIT_INFRA_BRANCH }}" >> "$GITHUB_ENV"
          echo "TF_VAR_database_user_secret=${{ secrets.POSTGRES_USER }}" >> "$GITHUB_ENV"
          echo "TF_VAR_database_password_secret=${{ secrets.POSTGRES_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_jwt_secret=${{ secrets.JWT_SECRET }}" >> "$GITHUB_ENV"
          echo "TF_VAR_api_key_chatbot=${{ secrets.API_KEY_CHATBOT }}" >> "$GITHUB_ENV"
          echo "TF_VAR_spring_datasource_password=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_spring_datasource_username=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> "$GITHUB_ENV"
          echo "TF_VAR_default_user_password=${{ secrets.DEFAULT_USER_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_grafana_admin_password=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_aws_lab_role=${{ vars.TF_AWS_LAB_ROLE }}" >> "$GITHUB_ENV"
          echo "TF_VAR_bucket_name_lambda=${{ vars.TF_LAMBDA_BUCKET }}" >> "$GITHUB_ENV"
          echo "TF_VAR_bucket_name_kafka=${{ vars.TF_KAFKA_BUCKET }}" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Resolve Lambda artifact
        env:
          BUCKET: ${{ vars.TF_LAMBDA_BUCKET }}
          INPUT_KEY: ${{ github.event.inputs.lambda_key }}
          INPUT_HASH: ${{ github.event.inputs.lambda_hash }}
          PAYLOAD_KEY: ${{ github.event.client_payload.lambda_key }}
          PAYLOAD_HASH: ${{ github.event.client_payload.lambda_hash }}
        run: |
          set -euo pipefail

          KEY="${INPUT_KEY:-${PAYLOAD_KEY:-}}"
          HASH="${INPUT_HASH:-${PAYLOAD_HASH:-}}"

          if [ -z "$KEY" ]; then
            KEY=$(aws s3api list-objects-v2 \
              --bucket "$BUCKET" \
              --query 'reverse(sort_by(Contents, &LastModified))[0].Key' \
              --output text)

            if [ -z "$KEY" ] || [ "$KEY" = "None" ]; then
              echo "ERRO: nenhum artefato da Lambda encontrado no bucket $BUCKET."
              exit 1
            fi
          fi

          if [ -z "$HASH" ]; then
            aws s3 cp "s3://$BUCKET/$KEY" ./lambda.zip
            HASH=$(openssl dgst -sha256 -binary ./lambda.zip | base64 -w 0)
          fi

          echo "Lambda key: $KEY"
          echo "TF_VAR_lambda_s3_key=$KEY" >> "$GITHUB_ENV"
          echo "TF_VAR_source_hash_code_lambda=$HASH" >> "$GITHUB_ENV"

      - name: Terraform Apply Cluster
        run: terraform apply -auto-approve -target=module.eks

      - name: Cleanup Orphaned Helm Releases
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || true)

          if [ -z "$CLUSTER_NAME" ]; then
            echo "No cluster in state; skipping."
            exit 0
          fi

          aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "$CLUSTER_NAME"

          helm list -A -o json |
            jq -r '.[] | select(.status != "deployed") | "\(.name) \(.namespace)"' |
            while read -r NAME NS; do
              [ -z "$NAME" ] && continue
              echo "Uninstalling orphaned release: $NAME ($NS)"
              helm uninstall "$NAME" -n "$NS" || true
            done

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Debug Terraform Outputs
        run: |
          terraform output

      - name: Configure kubectl
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name)

          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "$CLUSTER_NAME"

      - name: Wait for ALB
        run: |
          echo "Aguardando o ALB..."

          for i in $(seq 1 30); do

            ALB_URL=$(kubectl get ingress workshop-backend-ingress \
              -n oficina-mecanica \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)

            if [ -n "$ALB_URL" ]; then
              echo "ALB encontrado:"
              echo "$ALB_URL"

              echo "TF_VAR_backend_url=http://$ALB_URL" >> "$GITHUB_ENV"
              break
            fi

            echo "ALB ainda não disponível. Tentativa $i/30..."
            sleep 20

          done

          if [ -z "${ALB_URL:-}" ]; then
            echo "ERRO: ALB não foi encontrado."

            kubectl get ingress -n oficina-mecanica

            exit 1
          fi

      - name: Terraform Apply with Backend URL
        run: terraform apply -auto-approve

      - name: Update DB URL and DB name on configmap manifest
        env:
          GH_TOKEN: ${{ secrets.PAT_REPO_INFRA_LAMBDA }}
          REPO_URL: ${{ vars.GIT_INFRA_REPO_URL }}
          BASE_BRANCH: ${{ vars.GIT_INFRA_BRANCH }}
        run: |
          set -e

          DB_HOST=$(terraform output -raw db_host)
          DB_PORT=$(terraform output -raw db_port)
          DB_NAME=$(terraform output -raw db_name)

          DATABASE_URL="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"

          echo "Spring Datasource URL: ${DATABASE_URL}"

          git clone "https://x-access-token:${{ secrets.PAT_REPO_INFRA_LAMBDA }}@${REPO_URL#https://}" k8s-infra

          cd k8s-infra

          CONFIGMAP="k8s/configmap.yaml"

          BRANCH_NAME="chore/update-database-config-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH_NAME"

          sed -i "s|^[[:space:]]*SPRING_DATASOURCE_URL:.*|  SPRING_DATASOURCE_URL: ${DATABASE_URL}|" "$CONFIGMAP"
          sed -i "s|^[[:space:]]*POSTGRES_DB:.*|  POSTGRES_DB: ${DB_NAME}|" "$CONFIGMAP"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- "$CONFIGMAP"; then
            echo "Nenhuma alteração detectada no ConfigMap."
            exit 0
          fi

          git add "$CONFIGMAP"
          git commit -m "chore: update database configuration"
          git push origin "$BRANCH_NAME"

          PR_URL=$(gh pr create \
            --repo "${{ github.repository }}" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "chore: update database configuration" \
            --body "Automated update of the database configuration.

          Database host: ${DB_HOST}
          Database port: ${DB_PORT}
          Database name: ${DB_NAME}

          Generated by GitHub Actions run ${GITHUB_RUN_ID}.")

          gh pr merge "$PR_URL" \
            --repo "${{ github.repository }}" \
            --merge

          git push origin --delete "$BRANCH_NAME"
          git branch -D "$BRANCH_NAME" || true

          echo "ConfigMap atualizado, PR mergeado e branch removida com sucesso."
