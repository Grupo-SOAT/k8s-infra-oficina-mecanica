name: Validate gateway infrastructure
on:
  pull_request:
    paths: ['modules/aws/gateway/**', 'modules/aws/network/**', 'main.tf', 'variables.tf', '.github/workflows/gateway-ci.yaml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.11.4'
      - run: terraform init -backend=false -input=false
      - run: terraform validate