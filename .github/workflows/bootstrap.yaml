name: Bootstrap AWS

on:
  workflow_dispatch:

jobs:

  setup-infra:

    name: Bootstrap AWS Resources

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Create Terraform State Bucket
        run: |
          if aws s3api head-bucket \
            --bucket grupo-soat-oficina-mecanica-terraform-state 2>/dev/null
          then
            echo "Terraform state bucket already exists."
          else
            echo "Creating Terraform state bucket..."

            aws s3api create-bucket \
              --bucket grupo-soat-oficina-mecanica-terraform-state \
              --region us-east-1
          fi

      - name: Initialize Terraform
        run: terraform init

      - name: Validate Terraform
        run: terraform validate

      - name: Plan Terraform
        run: terraform plan

      - name: Create Lambda Code Bucket
        run: terraform apply -auto-approve -target=module.s3_lambda_code