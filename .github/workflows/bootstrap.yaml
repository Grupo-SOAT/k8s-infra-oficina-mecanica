name: Bootstrap AWS

on:
  workflow_dispatch:

jobs:

  setup-infra:

    name: Bootstrap AWS Resources

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
    
      - name: Setup Terraform on Runner
        uses: hashicorp/setup-terraform@v4
        with:
            terraform_version: "1.15.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Create Terraform State Bucket
        run: |
          if aws s3api head-bucket \
            --bucket grupo-soat-oficina-mecanica-1-terraform-state 2>/dev/null
          then
            echo "Terraform state bucket already exists."
          else
            echo "Creating Terraform state bucket..."

            aws s3api create-bucket \
              --bucket grupo-soat-oficina-mecanica-1-terraform-state \
              --region us-east-1
          fi

      - name: Create Lambda Code Bucket
        run: |
          if aws s3api head-bucket \
            --bucket lambda-code-archive-oficina-mecanica 2>/dev/null
          then
            echo "Lambda Code bucket already exists."
          else
            echo "Creating Lambda code bucket..."

            aws s3api create-bucket \
              --bucket lambda-code-archive-oficina-mecanica \
              --region us-east-1
          fi
      
      - name: Create Kafka History Bucket
        run: |
          if aws s3api head-bucket \
            --bucket oficina-mecanica-kafka-history 2>/dev/null
          then
            echo "Kafka History bucket already exists."
          else
            echo "Creating Kafka History state bucket..."

            aws s3api create-bucket \
              --bucket oficina-mecanica-kafka-history \
              --region us-east-1
          fi