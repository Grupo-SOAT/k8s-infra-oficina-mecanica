name: Destroy AWS Resources

on:
  workflow_dispatch:

concurrency:
  group: deploy-aws-resources
  cancel-in-progress: false

jobs:

  destroy-infra:

    name: Destroy AWS Resources

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform on Runner
        uses: hashicorp/setup-terraform@v4
        with:
            terraform_version: "1.15.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set Secrets for Terraform
        run: |
          echo "TF_VAR_aws_region=${{ vars.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "TF_VAR_aws_lab_role=${{ vars.TF_AWS_LAB_ROLE }}" >> "$GITHUB_ENV"
          echo "TF_VAR_database_user_secret=${{ secrets.POSTGRES_USER }}" >> "$GITHUB_ENV"
          echo "TF_VAR_database_password_secret=${{ secrets.POSTGRES_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_jwt_secret=${{ secrets.JWT_SECRET }}" >> "$GITHUB_ENV"
          echo "TF_VAR_api_key_chatbot=${{ secrets.API_KEY_CHATBOT }}" >> "$GITHUB_ENV"
          echo "TF_VAR_spring_datasource_password=${{ secrets.SPRING_DATASOURCE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_spring_datasource_username=${{ secrets.SPRING_DATASOURCE_USERNAME }}" >> "$GITHUB_ENV"
          echo "TF_VAR_default_user_password=${{ secrets.DEFAULT_USER_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_grafana_admin_password=${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}" >> "$GITHUB_ENV"
          echo "TF_VAR_bucket_name_lambda=${{ vars.TF_LAMBDA_BUCKET }}" >> "$GITHUB_ENV"
          echo "TF_VAR_bucket_name_kafka=${{ vars.TF_KAFKA_BUCKET }}" >> "$GITHUB_ENV"

      - name: Destroy Lambda S3 Bucket
        continue-on-error: true
        env:
          BUCKET: ${{ vars.TF_LAMBDA_BUCKET }}
        run: |
          echo "Limpando bucket: $BUCKET"

          while true; do
            OBJECTS=$(aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --query 'Versions[].{Key:Key,VersionId:VersionId}' \
              --output json)

            DELETE_MARKERS=$(aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' \
              --output json)

            ALL=$(jq -n \
              --argjson versions "$OBJECTS" \
              --argjson markers "$DELETE_MARKERS" \
              '$versions + $markers')

            COUNT=$(echo "$ALL" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            echo "Excluindo $COUNT objetos/versões..."

            echo "$ALL" |
              jq '{Objects: .[:1000], Quiet: true}' |
              aws s3api delete-objects \
                --bucket "$BUCKET" \
                --delete file:///dev/stdin
          done

          echo "Excluindo bucket..."
          aws s3api delete-bucket --bucket "$BUCKET"

          echo "Bucket $BUCKET excluído."

      - name: Destroy Kafka History S3 Bucket
        continue-on-error: true
        env:
          BUCKET: ${{ vars.TF_KAFKA_BUCKET }}
        run: |
          echo "Limpando bucket: $BUCKET"

          while true; do
            OBJECTS=$(aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --query 'Versions[].{Key:Key,VersionId:VersionId}' \
              --output json)

            DELETE_MARKERS=$(aws s3api list-object-versions \
              --bucket "$BUCKET" \
              --query 'DeleteMarkers[].{Key:Key,VersionId:VersionId}' \
              --output json)

            ALL=$(jq -n \
              --argjson versions "$OBJECTS" \
              --argjson markers "$DELETE_MARKERS" \
              '$versions + $markers')

            COUNT=$(echo "$ALL" | jq 'length')

            if [ "$COUNT" -eq 0 ]; then
              break
            fi

            echo "Excluindo $COUNT objetos/versões..."

            echo "$ALL" |
              jq '{Objects: .[:1000], Quiet: true}' |
              aws s3api delete-objects \
                --bucket "$BUCKET" \
                --delete file:///dev/stdin
          done

          echo "Excluindo bucket..."
          aws s3api delete-bucket --bucket "$BUCKET"

          echo "Bucket $BUCKET excluído."

      - name: Initialize Terraform
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Configure kubectl
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || true)

          if [ -z "$CLUSTER_NAME" ]; then
            echo "No cluster in state; skipping kubeconfig."
            exit 0
          fi

          aws eks update-kubeconfig \
            --region "${{ vars.AWS_REGION }}" \
            --name "$CLUSTER_NAME"

      - name: Delete app ingress and wait for Load Balancer finalizer
        run: |
          CLUSTER_NAME=$(terraform output -raw cluster_name 2>/dev/null || true)

          if [ -z "$CLUSTER_NAME" ]; then
            echo "No cluster in state; skipping ingress cleanup."
            exit 0
          fi

          kubectl delete ingress workshop-backend-ingress \
            -n oficina-mecanica --ignore-not-found --timeout=120s || true

          for i in $(seq 1 30); do
            REMAINING=$(kubectl get ingress -n oficina-mecanica --no-headers 2>/dev/null | wc -l)

            if [ "$REMAINING" -eq 0 ]; then
              echo "Ingress removido."
              break
            fi

            echo "Aguardando finalizer do Load Balancer... tentativa $i/30"
            sleep 10
          done

      - name: Terraform Destroy Plan
        run: terraform plan -destroy

      - name: Destroy all Resources
        run: terraform destroy -auto-approve
