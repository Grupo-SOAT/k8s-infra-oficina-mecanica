name: Gateway Test (isolado)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação a executar no harness de teste isolado do gateway"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

jobs:

  gateway-test:

    name: Terraform ${{ inputs.action }} - Gateway Test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: modules/aws/gateway/test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform on Runner
        uses: hashicorp/setup-terraform@v4
        with:
            terraform_version: "1.15.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Create Dedicated State Bucket (se não existir)
        run: |
          BUCKET="grupo-soat-oficina-mecanica-1-terraform-state"

          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET já existe."
          else
            echo "Criando bucket $BUCKET..."
            aws s3api create-bucket --bucket "$BUCKET" --region us-east-1
          fi

      - name: Discover Latest Lambda Artifact
        run: |
          BUCKET="lambda-code-archive-oficina-mecanica2"

          LAMBDA_KEY=$(aws s3api list-objects-v2 \
            --bucket "$BUCKET" \
            --query 'reverse(sort_by(Contents, &LastModified))[0].Key' \
            --output text)

          if [ -z "$LAMBDA_KEY" ] || [ "$LAMBDA_KEY" == "None" ]; then
            echo "Nenhum artefato encontrado em s3://$BUCKET. Rode a pipeline da Lambda (repositório da Lambda) antes de testar o gateway."
            exit 1
          fi

          echo "Artefato encontrado: $LAMBDA_KEY"

          aws s3 cp "s3://$BUCKET/$LAMBDA_KEY" ./lambda-artifact

          LAMBDA_HASH=$(openssl dgst -sha256 -binary ./lambda-artifact | base64 -w 0)

          echo "TF_VAR_lambda_s3_key=$LAMBDA_KEY" >> "$GITHUB_ENV"
          echo "TF_VAR_source_code_hash=$LAMBDA_HASH" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve

      - name: Smoke Test
        if: ${{ inputs.action == 'apply' }}
        run: |
          URL=$(terraform output -raw test_url)
          echo "Testando: $URL"
          curl -sS -i "$URL"

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
