name: Gateway Test (isolado)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ação a executar no harness de teste isolado do gateway"
        required: true
        type: choice
        options:
          - apply
          - destroy
        default: apply

jobs:

  gateway-test:

    name: Terraform ${{ inputs.action }} - Gateway Test

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: modules/aws/gateway/test

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform on Runner
        uses: hashicorp/setup-terraform@v4
        with:
            terraform_version: "1.15.6"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve

      - name: Smoke Test
        if: ${{ inputs.action == 'apply' }}
        run: |
          URL=$(terraform output -raw test_url)
          echo "Testando: $URL"
          curl -sS -i "$URL"

      - name: Terraform Destroy
        if: ${{ inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
