# Helm values for the loki release (observability ns), captured from the live
# validation cluster so the stack is reproducible from this repo.
# Chart: grafana/loki 7.3.0 (app 3.6.12)  |  repo: https://grafana.github.io/helm-charts
# Reinstall: helm upgrade --install loki grafana/loki -n observability --version 7.3.0 -f loki-values.yaml
backend:
  replicas: 0
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  limits_config:
    allow_structured_metadata: true
  schemaConfig:
    configs:
    - from: "2024-01-01"
      index:
        period: 24h
        prefix: loki_index_
      object_store: filesystem
      schema: v13
      store: tsdb
  storage:
    type: filesystem
monitoring:
  lokiCanary:
    enabled: false
  selfMonitoring:
    enabled: false
read:
  replicas: 0
simpleScalable:
  replicas: 0
singleBinary:
  replicas: 1
  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 256Mi
test:
  enabled: false
write:
  replicas: 0
