# kube-prometheus-stack values for the local kind validation cluster.
# Source of truth mirrors `helm get values kps -n observability` (2026-09)
# plus the Grafana provisioning additions for the monolith demo stack.
# Refs: ~/plans/.../observability.md §9; compose demo in mnl-oficina-mecanica/docker-local.
alertmanager:
  alertmanagerSpec:
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 100Mi
  enabled: true
grafana:
  adminPassword: admin
  service:
    type: ClusterIP
  testFramework:
    enabled: false
  resources:
    limits:
      cpu: 400m
      memory: 600Mi
    requests:
      cpu: 100m
      memory: 200Mi
  # Demo alerting provisioning (alert rules + contact point + notification policy),
  # ported from docker-local/observability/grafana/provisioning/alerting.
  # ConfigMap grafana-alerting is generated by kustomize from
  # k8s/observability/grafana/provisioning/alerting/*.yaml (kubectl apply -k .../grafana).
  extraConfigmapMounts:
    - name: grafana-alerting
      mountPath: /etc/grafana/provisioning/alerting
      configMap: grafana-alerting
      readOnly: true
  # SMTP -> mailpit (same image/service the demo uses; catches everything).
  "grafana.ini":
    smtp:
      enabled: true
      host: mailpit-service.oficina-mecanica.svc.cluster.local:1025
      from_address: alerts@oficina.local
      from_name: Oficina Observabilidade
      startTLS_policy: no-starttls
  # Demo dashboard (mnl observabilidade) is imported by the grafana dashboard sidecar:
  # ConfigMap grafana-dashboard-observabilidade generated by kustomize
  # (label grafana_dashboard=1, annotation grafana_folder=Observabilidade).
  # foldersFromFilesStructure=true makes the sidecar honor grafana_folder -> folder.
  sidecar:
    dashboards:
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
kube-state-metrics:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
nodeExporter:
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
prometheus:
  prometheusSpec:
    enableRemoteWriteReceiver: true
    probeSelectorNilUsesHelmValues: false
    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi
    retention: 6h
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
  serviceAccount:
    create: true
prometheusOperator:
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
