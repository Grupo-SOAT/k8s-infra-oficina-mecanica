apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: workshop-backend
  namespace: oficina-mecanica
  labels:
    release: kps
spec:
  selector:
    matchLabels:
      app: workshop-backend
  namespaceSelector:
    matchNames:
      - oficina-mecanica
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
