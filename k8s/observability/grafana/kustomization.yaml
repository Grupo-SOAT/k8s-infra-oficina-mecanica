apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gera os ConfigMaps do Grafana a partir dos arquivos fonte (sem duplicar conteudo em YAML).
# Referencia: ~/plans/.../observability.md §10.2. Nomes estaveis (disableNameSuffixHash)
# porque o kps-values.yaml monta `grafana-alerting` por nome (extraConfigmapMounts).
namespace: observability

configMapGenerator:
  - name: grafana-dashboard-observabilidade
    files:
      - provisioning/dashboards/observabilidade.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Observabilidade
  - name: grafana-alerting
    files:
      - provisioning/alerting/alert_rules.yaml
      - provisioning/alerting/contact_points.yaml
      - provisioning/alerting/notification_policies.yaml
    options:
      disableNameSuffixHash: true
