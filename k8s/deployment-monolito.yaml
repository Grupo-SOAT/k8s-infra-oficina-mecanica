apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-backend
  namespace: oficina-mecanica
spec:
  replicas: 1

  selector:
    matchLabels:
      app: workshop-backend
  template:
    metadata:
      labels:
        app: workshop-backend

    spec:
      initContainers:
        - name: otel-agent
          image: curlimages/curl:8.11.1
          securityContext:
            runAsUser: 0
          command:
            - "curl"
            - "-f"
            - "-L"
            - "-o"
            - "/otel/opentelemetry-javaagent.jar"
            - "https://repo1.maven.org/maven2/io/opentelemetry/javaagent/opentelemetry-javaagent/2.31.1/opentelemetry-javaagent-2.31.1.jar"
          volumeMounts:
            - name: otel-agent
              mountPath: /otel

      containers:
        - name: workshop-backend

          image: leonardooziro/sistema-oficina-mecanica-mnl:latest

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: otel-agent
              mountPath: /otel

          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/otel/opentelemetry-javaagent.jar -Xmx512m"

            - name: OTEL_SERVICE_NAME
              value: "mnl-oficina-mecanica"

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.observability.svc.cluster.local:4318"

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"

            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=oficina-mecanica"

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: SPRING_DATASOURCE_PASSWORD

            - name: DEFAULT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DEFAULT_USER_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: JWT_SECRET

            - name: API_KEY_CHATBOT
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: API_KEY_CHATBOT

            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: SPRING_KAFKA_BOOTSTRAP_SERVERS

          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"

            limits:
              cpu: "600m"
              memory: "768Mi"

          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 5

          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            failureThreshold: 30
            periodSeconds: 5

      volumes:
        - name: otel-agent
          emptyDir: {}
